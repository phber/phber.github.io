<meta property="og:locale:alternate" content="en_US">

<meta name="twitter:title" content="Journal — Philip Bergström, Violin">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">



<style>
  :root{
    --bg: #F1EADC;
    --bg-alt: #EAE1CF;
    --tint-rose: #ECDFD8;
    --tint-gold: #F1E5C6;
    --surface: #FBF7ED;
    --ink: #2B2620;
    --ink-soft: #5C5348;
    --ink-faint: #97907F;
    --accent: #A0702F;
    --accent-deep: #7C4F1D;
    --rosewood: #85394C;
    --rule: #CFC3A3;
    --rule-soft: #DCD2B9;
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Jost", ui-sans-serif, system-ui, sans-serif;
    font-weight: 300;
    font-size: 17px;
    line-height: 1.75;
    letter-spacing: 0.015em;
    -webkit-font-smoothing: antialiased;
  }
  .container{ max-width: 68rem; margin-inline:auto; padding-inline: 1.6rem; }
  @media(min-width:768px){ .container{ padding-inline: 3.2rem; } }

  h1,h2,h3,.display{
    font-family: "Cormorant Garamond", ui-serif, Georgia, serif;
    font-weight: 500;
    letter-spacing: 0.005em;
    text-wrap: balance;
    color: var(--ink);
  }
  em, .italic{ font-style: italic; }
  .eyebrow{
    font-family:"Jost", sans-serif;
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent-deep);
  }
  a{ color:inherit; }
  ::selection{ background: var(--accent); color: var(--surface); }

  /* --- the string rule: four lines of a violin's strings, thick (G) to thin (E) --- */
  .string-rule{
    width: 100%; max-width: 220px; margin-inline:auto;
    display:flex; flex-direction:column; gap:5px; align-items:stretch;
    opacity: 0.75;
  }
  .string-rule span{ display:block; background: var(--rule); border-radius: 2px; }
  .string-rule span:nth-child(1){ height:2.6px; opacity:.9; }
  .string-rule span:nth-child(2){ height:1.8px; opacity:.75; }
  .string-rule span:nth-child(3){ height:1.2px; opacity:.6; }
  .string-rule span:nth-child(4){ height:0.7px; opacity:.5; }
  .string-rule.left{ margin-inline:0; }
  .heading-rule{
    height:2px; width:52px; border-radius:2px; margin-top:1.3rem;
    background: linear-gradient(90deg, var(--accent-deep), transparent);
  }
  .heading-rule.center{ margin-inline:auto; background: linear-gradient(90deg, transparent, var(--accent-deep), transparent); }

  /* nav */
  .site-nav{
    position: sticky; top:0; z-index:40;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--rule-soft);
  }
  .brand{
    font-family:"Cormorant Garamond", serif; font-style:italic; font-weight:500;
    font-size: 1.3rem; letter-spacing:0.01em; text-decoration:none;
  }
  .site-nav .links{ display:flex; gap:1.9rem; overflow-x:auto; scrollbar-width:none; }
  .site-nav .links::-webkit-scrollbar{ display:none; }
  a.nav-link{
    font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase;
    color: var(--ink-soft); text-decoration:none; white-space:nowrap;
    display:inline-flex; align-items:center;
    padding: 0.85rem 0.1rem 0.7rem; border-bottom: 1px solid transparent;
    transition: color .2s ease, border-color .2s ease;
  }
  a.nav-link:hover, a.nav-link:focus-visible{ color: var(--ink); border-color: var(--accent); }

  /* language toggle */
  .lang-toggle{
    display:flex; align-items:center; gap:0.4rem;
    font-size:0.72rem; letter-spacing:0.08em; flex:none;
  }
  .lang-btn{
    display:inline-flex; align-items:center; gap:0.35rem;
    background:none; border:none; cursor:pointer;
    font-family:"Jost", sans-serif; font-size:0.72rem; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--ink-faint); padding:0.7rem 0.35rem; border-bottom: 1px solid transparent;
    transition: color .2s ease, border-color .2s ease;
  }
  .lang-btn[aria-pressed="true"]{ color: var(--ink); border-color: var(--accent); }
  .lang-btn:hover{ color: var(--ink); }
  .lang-sep{ color: var(--rule); font-size:0.72rem; }


  /* buttons — an invitation, not a UI control */
  .btn{
    display:inline-flex; align-items:center; gap:0.6rem;
    font-family:"Cormorant Garamond", serif; font-style:italic; font-weight:500;
    font-size: 1.15rem;
    padding: 0.7rem 1.7rem;
    color: var(--accent-deep);
    background: transparent;
    border: 1px solid var(--accent);
    border-radius: 2px 14px 2px 14px;
    text-decoration:none;
    cursor:pointer;
    transition: background .2s ease, color .2s ease;
  }
  .btn:hover{ background: var(--accent); color: var(--surface); }

  /* hero */
  .hero{ position:relative; overflow:clip; border-bottom: 1px solid var(--rule-soft); }
  .clef{
    position:absolute; right: clamp(1.5rem, 5vw, 4.5rem); top: 8%;
    line-height:1; display:flex; align-items:center;
    color: var(--accent); opacity:0.1; pointer-events:none; user-select:none;
  }
  .clef .dyn-p{
    font-family:"Cormorant Garamond", serif; font-weight:700; font-style:italic;
    font-size: clamp(5rem, 10.5vw, 7.6rem);
    transform: translateY(0.05em) translateX(0.08em);
  }
  .clef .dyn-flat{
    font-family:"Cormorant Garamond", serif; font-weight:400; font-style:normal;
    font-size: clamp(4.6rem, 9.8vw, 7.2rem);
    margin-left: -0.12em;
  }
  .hero-name{
    font-size: clamp(3rem, 8vw, 5.6rem);
    line-height: 1;
    margin:0;
  }
  .hero-name .surname{ display:block; }
  .hero-tagline{
    font-style:italic; font-weight:400; color: var(--accent-deep);
    font-size: clamp(1.5rem, 3.4vw, 2.1rem);
    margin: 0.3rem 0 0;
  }
  .dropcap::first-letter{
    font-family:"Cormorant Garamond", serif;
    font-style: italic; font-weight:600;
    font-size: 3.6rem; line-height: 0.7;
    float:left; padding: 0.06em 0.1em 0 0;
    color: var(--accent-deep);
  }
  .portrait-frame{
    border: 1px solid var(--rule);
    border-radius: 4px 26px 4px 26px;
    box-shadow: 0 18px 40px -26px rgba(30,20,10,0.5);
    transform: rotate(1deg);
    overflow: hidden;
    background: var(--surface);
    padding: 0.5rem;
  }
  .portrait-frame img{
    display:block; width:100%; height:auto;
    border-radius: 2px 22px 2px 22px;
    filter: sepia(0.12) contrast(1.02);
  }
  .photo-credit{
    font-size: 0.7rem; font-style: italic; color: var(--ink-faint);
    text-align: right; margin: 0.5rem 0.3rem 0;
    transform: rotate(1deg);
  }
  .ensemble-photo{
    border: 1px solid var(--rule);
    border-radius: 4px 26px 4px 26px;
    box-shadow: 0 14px 34px -24px rgba(30,20,10,0.5);
    overflow: hidden;
    background: var(--surface);
    padding: 0.45rem;
    margin-bottom: 1.4rem;
  }
  .ensemble-photo img{
    display:block; width:100%; height:auto;
    border-radius: 2px 22px 2px 22px;
    filter: sepia(0.1) contrast(1.03);
  }
  .note-card{
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 3px 22px 3px 22px;
    box-shadow: 0 18px 40px -28px rgba(30,20,10,0.55);
    transform: rotate(-1.1deg);
    padding: 2rem 2.1rem;
  }
  .note-card p{ margin:0; }
  .note-card .label{
    font-size:0.68rem; letter-spacing:0.2em; text-transform:uppercase; color:var(--ink-faint);
    margin-bottom:0.35rem;
  }

  /* section rhythm */
  .section{ padding-block: 5rem; position:relative; }
  .section-flush{ padding-block: 3rem 5rem; }
  .kicker{ margin:0 0 0.6rem; }
  .section h2{ font-size: clamp(1.9rem, 3.6vw, 2.6rem); margin: 0 0 0.4rem; }
  .section .dek{ color: var(--ink-soft); max-width: 40ch; font-style: italic; }

  /* collaborations: asymmetric organic blocks */
  .duet{ position:relative; }
  .duet-item{ position:relative; padding: 2.6rem 2.4rem; }
  .duet-item::before{
    content:""; position:absolute; inset:0;
    border-radius: 58% 42% 51% 49% / 46% 54% 46% 54%;
    z-index:-1;
  }
  .duet-item.rose::before{ background: var(--tint-rose); }
  .duet-item.gold::before{ background: var(--tint-gold); }
  .duet-item h3{ font-size: 2rem; }
  .duet-item p{ color: var(--ink-soft); max-width: 42ch; }
  .duet-tags{ margin-top:1.1rem; font-style:italic; color: var(--ink-faint); font-size:0.92rem; }

  /* sheet music: editorial list, not a spreadsheet */
  .score-list{ display:flex; flex-direction:column; }
  .score-row{
    display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap: 0.5rem 1.5rem;
    padding: 1.5rem 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  .score-main{ flex: 1 1 22rem; }
  .score-main .t{ font-family:"Cormorant Garamond", serif; font-style:italic; font-size:1.5rem; }
  .score-main .c{ color: var(--ink-soft); font-size:0.92rem; margin-left:0.15rem; }
  .score-arr{ color: var(--ink-faint); font-style:italic; font-size:0.92rem; flex: 0 0 auto; }
  .score-dl{
    font-size:0.82rem; letter-spacing:0.06em; color: var(--accent-deep);
    text-decoration:none; border-bottom: 1px solid var(--accent);
    padding-bottom:1px; flex: 0 0 auto; white-space:nowrap;
    transition: color .2s ease, border-color .2s ease;
  }
  .score-dl:hover{ color: var(--accent); border-color: var(--accent); }

  /* journal */
  .journal-lead{
    border-bottom:1px solid var(--rule-soft); padding-bottom:2.4rem; margin-bottom:2.4rem;
    cursor:pointer;
  }
  .journal-lead .post-cat{ margin-bottom:0.5rem; }
  .journal-lead h3{ font-size: clamp(1.7rem,3vw,2.2rem); max-width: 22ch; }
  .journal-lead p{ max-width:58ch; font-size:1.08rem; color: var(--ink-soft); }
  .journal-grid{ columns: 1; column-gap: 3rem; }
  @media(min-width:800px){ .journal-grid{ columns: 2; } }
  .post-card{
    break-inside: avoid; padding-bottom: 2.2rem; margin-bottom: 2.2rem; border-bottom: 1px solid var(--rule-soft);
    cursor:pointer;
  }
  .post-img{
    border: 1px solid var(--rule);
    border-radius: 3px 20px 3px 20px;
    overflow: hidden;
    background: var(--surface);
    padding: 0.4rem;
    margin-bottom: 1rem;
  }
  .post-img img{ display:block; width:100%; height:auto; border-radius: 2px 16px 2px 16px; }
  .post-cat{ font-style:italic; color: var(--rosewood); font-size:0.92rem; }
  .post-card h3{ font-size: 1.35rem; margin: 0.3rem 0 0.6rem; }
  .post-card p{ color: var(--ink-soft); margin:0; }
  .read-more{
    color: var(--accent-deep) !important; font-style: italic; font-size:0.88rem !important;
    margin-top: 0.7rem !important; transition: color .2s ease;
  }
  .journal-lead:hover .read-more, .post-card:hover .read-more{ color: var(--accent) !important; }
  .journal-lead:focus-visible, .post-card:focus-visible{ outline: 2px solid var(--accent); outline-offset: 4px; }

  .post-modal{
    position: fixed; inset: 0; z-index: 200;
    background: color-mix(in srgb, var(--ink) 55%, transparent);
    display:flex; align-items:flex-start; justify-content:center;
    padding: 5vh 1.2rem;
    opacity:0; pointer-events:none;
    transition: opacity .25s ease;
    overflow-y: auto;
  }
  .post-modal.show{ opacity:1; pointer-events:auto; }
  .post-modal-card{
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px 28px 4px 28px;
    box-shadow: 0 30px 70px -30px rgba(0,0,0,0.5);
    max-width: 42rem; width:100%;
    padding: 2.6rem clamp(1.4rem, 5vw, 3.2rem);
    position: relative;
    transform: translateY(14px);
    transition: transform .25s ease;
  }
  .post-modal.show .post-modal-card{ transform: translateY(0); }
  .post-modal-close{
    position:absolute; top:1rem; right:1.2rem;
    background:none; border:none; font-size:1.8rem; line-height:1; color: var(--ink-faint);
    cursor:pointer; font-family: serif;
  }
  .post-modal-close:hover{ color: var(--ink); }
  #post-modal-title{ font-size: clamp(1.5rem,3vw,2rem); margin: 0.3rem 0 1.2rem; text-wrap:balance; }
  .post-modal-body p{ color: var(--ink-soft); margin: 0 0 1.1rem; }
  .post-modal-body p:last-child{ margin-bottom:0; }
  #post-modal-img .post-img{ margin-bottom: 1.4rem; }
  .post-modal-body h4{
    font-family:"Cormorant Garamond", serif; font-weight:600; font-style:italic;
    font-size: clamp(1.25rem, 2.4vw, 1.55rem); color: var(--ink);
    margin: 2.1rem 0 0.9rem; text-wrap:balance;
  }
  .post-modal-body h4:first-child{ margin-top:0; }
  .post-modal-body h5{
    font-family:"Cormorant Garamond", serif; font-weight:600;
    font-size: clamp(1.05rem, 1.8vw, 1.2rem); color: var(--accent-deep);
    margin: 1.6rem 0 0.6rem;
  }
  .post-modal-body h5 a{ color: var(--accent-deep); text-decoration:none; border-bottom: 1px solid var(--accent); }
  .post-modal-body h5 a:hover{ color: var(--accent); }
  .post-modal-body .lead-italic{
    font-style:italic; color: var(--ink-faint); font-size:0.95rem;
    border-left: 2px solid var(--rule); padding-left: 1rem; margin: 0 0 1.4rem;
  }
  .post-modal-body blockquote{
    font-family:"Cormorant Garamond", serif; font-style:italic;
    font-size: clamp(1.05rem, 2vw, 1.25rem); color: var(--ink-soft);
    border-left: 2px solid var(--accent); padding-left: 1.2rem; margin: 1.2rem 0 1.4rem;
  }
  .post-modal-body blockquote cite{ display:block; margin-top:0.6rem; font-style:normal; font-size:0.85rem; color: var(--ink-faint); }
  .post-modal-body ol{ margin: 0 0 1.1rem; padding-left: 1.4rem; color: var(--ink-soft); }
  .post-modal-body ol li{ margin-bottom: 0.4rem; padding-left: 0.3rem; }
  .post-modal-body details{
    border-bottom: 1px solid var(--rule-soft); padding: 0.9rem 0;
  }
  .post-modal-body details:first-of-type{ border-top: 1px solid var(--rule-soft); }
  .post-modal-body details summary{
    font-family:"Cormorant Garamond", serif; font-style:italic; font-weight:600;
    font-size: 1.08rem; color: var(--ink); cursor:pointer; list-style:none;
  }
  .post-modal-body details summary::-webkit-details-marker{ display:none; }
  .post-modal-body details summary::before{ content:"+ "; color: var(--accent); }
  .post-modal-body details[open] summary::before{ content:"\2013 "; }
  .post-modal-body details p{ margin: 0.7rem 0 0; font-size:0.96rem; }
  .post-modal-body table{
    width:100%; border-collapse:collapse; margin: 1rem 0 0.4rem; font-size:0.95rem;
  }
  .post-modal-body th, .post-modal-body td{
    padding: 0.5rem 0.8rem; text-align:left; border-bottom: 1px solid var(--rule-soft);
  }
  .post-modal-body th{ font-family:"Jost", sans-serif; font-weight:600; font-size:0.8rem; letter-spacing:0.04em; text-transform:uppercase; color: var(--accent-deep); }
  .post-modal-body td{ color: var(--ink-soft); }
  .post-modal-body .caption{
    text-align:center; font-style:italic; font-size:0.86rem; color: var(--ink-faint);
    margin: -0.5rem 0 1.4rem;
  }
  .post-modal-body .post-img{ margin: 1rem 0; }
  .post-modal-body .post-img img{ width:100%; border-radius: 4px; display:block; }

  /* calendar: a program note, not a table */
  .program-list{ display:flex; flex-direction:column; }
  .program-row{
    padding: 1.3rem 0; border-bottom: 1px solid var(--rule-soft);
    display:flex; flex-wrap:wrap; align-items:baseline; gap: 0.3rem 0.6rem;
    font-size: 1.08rem;
  }
  .program-row .d{ font-style:italic; color: var(--accent-deep); font-variant-numeric: tabular-nums; }
  .program-row .sep{ color: var(--ink-faint); }
  .program-row .venue{ color: var(--ink-soft); }
  .program-row .prog{ font-style:italic; }
  .program-row .loc{ color: var(--ink-faint); font-size:0.88rem; margin-left:auto; white-space:nowrap; }

  .year-group{ margin-top: 0.2rem; }
  .year-group summary{
    list-style:none; cursor:pointer; padding: 0.9rem 0;
    display:flex; align-items:center; gap:0.4rem;
    font-size:0.78rem; letter-spacing:0.05em;
    color: var(--ink-faint); border-bottom: 1px solid var(--rule-soft);
    transition: color .2s ease;
  }
  .year-group summary:hover{ color: var(--ink-soft); }
  .year-group summary::-webkit-details-marker{ display:none; }
  .year-group summary .chevron{
    width:0.7rem; height:0.7rem; flex:none;
    transition: transform .2s ease;
  }
  .year-group[open] summary .chevron{ transform: rotate(180deg); }
  .year-group[open] summary{ border-bottom: 1px solid var(--rule-soft); }
  .year-group .program-list{ margin-top: -1px; }

  /* contact — a stationery card */
  .card-invite{
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px 30px 4px 30px;
    box-shadow: 0 24px 60px -34px rgba(30,20,10,0.5);
    padding: 2.8rem clamp(1.6rem, 5vw, 4rem);
  }
  .card-invite .flourish{ text-align:center; color: var(--accent); font-size:1.4rem; margin-bottom:0.6rem; }
  .card-invite .invite-head{ text-align:center; margin-bottom: 2.2rem; }
  .card-invite .invite-head h2{ margin-bottom:0.3rem; }
  .card-invite .invite-head p{ font-style:italic; color:var(--ink-soft); max-width:40ch; margin-inline:auto; }

  .field{ display:flex; flex-direction:column; gap:0.35rem; }
  .field label{
    font-style: italic; font-family:"Cormorant Garamond", serif; font-size:1rem; color: var(--ink-soft);
  }
  .field input, .field textarea{
    background: transparent;
    border: none; border-bottom: 1px solid var(--rule);
    color: var(--ink);
    padding: 0.5rem 0.1rem;
    font-family:"Jost", sans-serif; font-weight:300;
    font-size: 1rem; letter-spacing:0.01em;
    border-radius:0;
  }
  .field input:focus, .field textarea:focus{
    outline:none; border-bottom-color: var(--accent);
  }
  .field textarea{ resize:vertical; min-height:5.5rem; }

  footer{ color: var(--ink-faint); font-size:0.85rem; font-style:italic; }

  @media (prefers-reduced-motion: no-preference){
    .reveal{ animation: rise 0.8s ease both; }
  }
  @keyframes rise{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

  #toast{
    position:fixed; bottom:1.6rem; left:50%; transform:translateX(-50%) translateY(140%);
    background: var(--ink); color: var(--bg);
    font-family:"Cormorant Garamond", serif; font-style:italic; font-size:1.05rem;
    padding: 0.85rem 1.5rem; border-radius: 3px 16px 3px 16px;
    transition: transform .4s ease; z-index:100;
  }
  #toast.show{ transform:translateX(-50%) translateY(0); }

  @media(max-width:820px){
    .hero-grid{ grid-template-columns: 1fr !important; gap: 2.4rem !important; }
    .note-card{ transform: rotate(0); }
  }
  @media(max-width:720px){
    .duet-grid{ grid-template-columns: 1fr !important; }
    .duet-item{ padding: 2.2rem 1.6rem; }
  }
  @media(max-width:600px){
    .program-row .loc{ margin-left:0; }
    .score-row{ flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:0.4rem; }
    .score-main, .score-arr, .score-dl{ flex: none; }
  }

  /* mobile nav: brand+lang row scrolls away, links row sticks to top on its own */
  .links-mobile{ display:none; }

        "<p class='caption'>Louis Spohr's original patent drawing for the “fiddleholder,” from his Violinschule (1832). This device, mounted directly on the violin's body, is considered the earliest form of the modern chin rest.</p>",
        "<p>Shoulder padding entered the historical record a few years later, first documented in 1834, but the clip-on shoulder rest as we would recognize it today took considerably longer to arrive. An early version was patented by Francis L. Becker in 1881.</p>",

        "<p class='caption'>Mirko Medakovic's 1930 patent for a “Shoulder Rest for Violins,” the first design closely resembling the clamp-style rests commonly used today.</p>",
        "<p>In other words, the &quot;standard setup&quot; most students learn today is a relatively recent addition to a much longer and more varied history.</p>",
        "<h5>What the Research Says About Sound</h5>",
        "<p>One of the more common arguments against shoulder rests is that they dampen or distort the violin's sound. The acoustic research tells a more nuanced story.</p>",
        "<ul><li>Studies have consistently found no meaningful difference in volume between playing with or without a shoulder rest.</li><li>There is measurable change in the distribution of overtones, meaning the shoulder rest does slightly affect timbre, but the effect is weak and varies significantly from one instrument to another.</li><li>It remains unclear whether these subtle timbral shifts are something a listener could actually perceive.</li></ul>",
        "<p>Interestingly, several teachers in this study who play without a shoulder rest reported that they felt their sound had improved after making the switch. The researchers point out, though, that this may have more to do with newfound technical freedom than any direct acoustic effect of removing the rest.</p>",
        "<h5>What the Research Says About the Body</h5>",
        "<p>Ergonomic studies, largely using EMG sensors to track muscle activity, offer some useful insight, even if the overall picture remains incomplete.</p>",
        "<ul><li>Using a shoulder rest tends to reduce activity in the neck and upper back muscles, while increasing activity in the front of the shoulder.</li><li>Raising the height of a shoulder rest tends to reduce comfort and increase the force needed to keep the violin steady.</li><li>Even small adjustments, such as the height of the rest's feet, can produce a measurable change in muscle activity.</li></ul>",
        "<p>That said, a review of these studies found that inconsistent methods across experiments make it difficult to draw firm conclusions about which setup is genuinely more beneficial for the body. The evidence indicates that setup matters, but not conclusively which setup is best suited to whom.</p>",
        "<h5>Who Really Chooses the Setup?</h5>",
        "<p>Perhaps the most striking finding in this research concerns pedagogy rather than physiology: the choice of shoulder rest is rarely the student's own.</p>",
        "<ul><li>In the survey, 76% of respondents cited teachers as an influence on their personal shoulder rest choice, well ahead of friends and colleagues (42%) or watching famous violinists (18%).</li><li>All five interviewed teachers began playing with a shoulder rest as children, simply because that was what their own teachers used.</li><li>Four of the five later switched to playing without one, but not until adulthood, and usually only after experiencing pain or receiving a specific recommendation to try it.</li></ul>",
        "<p>This suggests something of a generational pattern: if a teacher has never explored playing without a shoulder rest, their students are unlikely to either.</p>",
        "<h5>A Snapshot of the Numbers</h5>",
        "<p>The survey drew responses from 72 violin teachers across the five Nordic countries, with the largest groups based in Sweden (29 respondents) and Norway (20 respondents), followed by smaller samples from Finland, Iceland, and Denmark. Taken together, the results offer a useful picture of where Nordic violin teachers actually stand today:</p>",
        "<ul><li>Over 70% of respondents use a shoulder rest as their primary setup, while around 15% play restless and roughly 11% use a shoulder pad.</li><li>73% of respondents said they had made a conscious effort at some point to learn to play without a shoulder rest.</li><li>Despite that effort, only about 44% of respondents currently feel able to play comfortably without one.</li><li>When it comes to teaching, roughly half of respondents said they generally prefer their students to use a shoulder rest, while the rest favor a mix, a pad, or occasionally restless playing.</li><li>Nearly half of all respondents described finding it somewhat to very difficult to help a student settle on the right shoulder rest setup.</li></ul>",
        "<p>This last figure is particularly notable. Even experienced teachers are not entirely confident navigating this decision, which suggests that the uncertainty identified in this research is widely shared, rather than confined to a small, vocal minority.</p>",
        "<h5>What This Means for You</h5>",
        "<p>Drawing directly from these findings, here are some practical takeaways for violinists and teachers:</p>",
        "<ul><li><strong>Don't assume today's convention is the only option.</strong> The historical record shows that violin support methods have changed considerably over time, and there's no reason to treat the current default as final.</li><li><strong>Pay attention to technique, not just equipment.</strong> Teachers interviewed for this study noted that tension can arise either way, whether from a raised shoulder compensating for no rest, or a locked arm caused by an ill-fitting one.</li><li><strong>Consider the whole setup, not just the rest.</strong> Violin size, chin rest type, and where the instrument sits on the shoulder all interact with the shoulder rest itself. These factors are best evaluated together.</li><li><strong>Expect change as students grow.</strong> Interviewees noted that younger players may need their setup reassessed far more often than adults, whose bodies have largely stopped changing.</li><li><strong>If you're curious about switching, ease into it gradually.</strong> One interviewed teacher recommended practicing without a shoulder rest for just two minutes per session at first, rather than switching all at once.</li><li><strong>Teachers, it's worth reflecting on your own influence.</strong> Given that over three-quarters of survey respondents named their own teacher as a key influence, it may be worth considering whether your own preferences are limiting your students' opportunities to explore other options.</li></ul>",
        "<h4>Concluding Remarks</h4>",
        "<p>Taken together, these findings suggest there is no single right answer to the shoulder rest question. The evidence, ergonomic, acoustic, and pedagogical alike, points instead toward something more individual: a choice shaped by the player's body, their history with the instrument, and who happened to be teaching them along the way.</p>",
        "<p>If you teach or play the violin, it might be worth asking yourself: did you choose your current setup, or did you simply inherit it? And has this research changed how you think about it?</p>"
      ]

      cat: "concepts", label: "Concepts",
      title: "Approaching Improvisation as a Classical Violinist",
      excerpt: "There is a story about Niccolò Paganini which dates back to 1825. Paganini was playing at the Teatro Del Falcone in Genoa and was asked by King Charles Felix to give an encore of a piece the king had liked during a performance in Genoa…",
      full: [
        "<p class='lead-italic'><em>Note: This is a shorter version of my bachelor thesis with the same title, which can be found in full <a href='https://gupea.ub.gu.se/items/30e2116b-73df-4960-bfc1-e85ffbc3a64f' target='_blank' rel='noopener'>here</a>.</em></p>",

        "<h4>Introduction</h4>",
        "<p>There is a story about Niccol&ograve; Paganini which dates back to 1825. Paganini was playing at the Teatro Del Falcone in Genoa and was asked by King Charles Felix to give an encore of a piece the king had liked during a performance in Genoa. But since Paganini had improvised, he was unable to repeat the performance and is said to have given this as his answer. As a result, he is said to have been expelled from the Kingdom of Sardinia for two years. The episode is the origin of the Italian expression &quot;Paganini non ripete&quot; - &quot;Paganini does not repeat&quot;.</p>",
        "<p>Approaching improvisation as a classical musician may feel daunting - our identities are usually strongly tied to a canonized repertoire where the goal is to realize the composer&rsquo;s intentions as closely as possible. The practice of improvisation is most often absent in the education of classical musicians today, even though it had a central part in European art music in previous centuries.</p>",
        "<p>I will share some of my thoughts and methods on how one could overcome this barrier. Like much else in music, improvisation is something that has to be practiced if you want to improve, and I will provide some exercises, or <em>games</em> that I found useful for this purpose.</p>",

        "<h4>How Do You Improvise?</h4>",
        "<blockquote>Improvisation, it is a mystery. You can write a book about it, but by the end, no one still knows what it is. When I improvise and I&rsquo;m in good form, I&rsquo;m like somebody half-sleeping. I even forget that there are people in front of me. Great improvisers are like priests, they are thinking only of their God.<br><cite>&mdash; St&eacute;phane Grappelli, Frets Magazine, 1981</cite></blockquote>",
        "<p>Improvisation is, as St&eacute;phane Grappelli pointed out, an elusive and puzzling concept since it concerns creative processes that largely occur on subconscious levels. So how can approach improvisation in a systematic way? During a conversation with musician Arve Henriksen, a trumpeter who has much experience playing in different contexts, he gave me the recommendation to use the skills I learned as a classically trained violinist as much as possible when improvising, or in other words use the abilities one already possesses. He also mentioned a set of three methods that are useful when approaching improvisation, namely: imitating, copying, and composing.</p>",

        "<h5>Imitation</h5>",
        "<p>Imitation can be used in an improvisational context to both respond to something we hear and to express certain ideas. Imitating does not mean we have to replicate something perfectly. We can imitate someone playing a different instrument than ours by perceiving a certain feeling of rhythm, tone, style, or other expression. We can also imitate sounds that are not generated by an instrument at all, such as bird song or the sound of an engine.</p>",
        "<p>To use a realistic example, assume that we want to improvise in the early hot club-style jazz of Grappelli. We can choose to imitate his bowings, vibrato and accents. The notes we play might differ completely from the ones Grappelli are playing and might not sound great in the beginning, but by imitating some of the basic elements of the &quot;style&quot;, we have found an entry point towards starting to improvise. To make an analogy, in order to adapt to a new culture or social context, one can imitate what other people are doing in order to learn its manners and conventions.</p>",

        "<h5>Copying</h5>",
        "<p>Copying is an element that is closely related to imitation. Whilst it might appear contradictory to consider copying as a method of approaching improvisation, it can be a useful tool to unlock doors to musical freedom. Similar to someone learning a new language by repeating new words and phrases, we can try to copy other musicians to learn a new musical language.</p>",
        "<p>This can be done practically by transcribing or by copying phrases or licks. If we play a piece exactly like someone else played it, we might not consider it to be improvisation. However, similar to when we speak, we use phrases or idioms that we know, yet we have the freedom of choosing when and where to use them, as well as the option to vary and change them in our own way.</p>",

        "<h5>Composing</h5>",
        "<p>The last element of improvisation can be considered to be composing something new in the moment. One can argue that all great compositions (along with art and literature for that matter) once started as improvisations. This might be the most obscure of the mentioned methods - how are we able to create new musical ideas from nothing? The philosophical answer might be that we generate ideas from everything around us along with all our experiences. Although I also believe that there are more practical and systematic ways of creating music in the moment, I believe one has to come up with and explore one's own methods of doing so.</p>",
        "<p>Personally, I found some compositional methods particularly useful, specifically on the violin. One way is to play with patterns, for example by repeating a certain fingering pattern on different strings, as well as trying out different permutations. Another is to use a certain hand frame by for example, arpeggiating a major/minor sixth on two strings and transposing it to different places on the fingerboard, with a third (and perhaps fourth) open string being played simultaneously, creating some interesting harmonies. I also believe knowing music theory is an important element to composing, since by rationally knowing what notes belong to a certain chord or key, we can improvise by combining these notes in different patterns and rhythms that work in a harmonic context.</p>",

        "<h4>Improvisation Inspiration</h4>",
        "<p>These are some of the videos and sites that I found particularly useful when approaching improvisation as a violinist. I believe the ideas and techniques they showcase can be applied to improvisation in any genre or tradition.</p>",

        "<h5><a href='https://youtu.be/HxXwBrPfnBE?si=JaUZrkHqbdl5ckUa' target='_blank' rel='noopener'>Darol Anger's 8 Paths of Improvisation</a></h5>",
        "<p>Here, Darol Anger presents 8 techniques to improvise over a tune, and I find them to be a good starting point for improvising over a melody in any genre. To summarize the video, the 8 techniques are:</p>",
        "<ol><li>Ornamentation</li><li>Adding eighth notes between melody notes</li><li>Changing the rhythm of the melody</li><li>Developing motives/fragments of the melody</li><li>Arpeggiating chord changes</li><li>Adding an additional voice to the melody or harmony</li><li>Combining &quot;licks&quot;, or already learned patterns</li><li>&quot;Free&quot; improvisation - playing without any rules</li></ol>",

        "<h5><a href='https://raag-hindustani.com/Improvisation.html' target='_blank' rel='noopener'>Improvisation in Indian Classical Music</a></h5>",
        "<p>Although improvisation is largely absent from today's Western classical music, it is an integral part of Indian classical music. This site provides a practical introduction to the basic improvisatory elements of a raga, which is a great musical format to explore improvisation. Briefly, a raga consists of three main parts:</p>",
        "<ol><li><em>Vistar</em> - An elaborative part with free tempo, where the tonality of the raga is introduced.</li><li><em>Jod</em> - A middle segment where a steady pulse is introduced.</li><li><em>Taan</em> - A final section where notes are played in rapid sequences, often with an element of surprise.</li></ol>",

        "<h5><a href='https://youtu.be/NbFuuF9w2PM?si=FYsJSADXZQhFCtSy' target='_blank' rel='noopener'>The Chop</a></h5>",
        "<p>If you aren't familiar with chopping, it is a percussive technique where the bow is dropped and dragged down the length of the string rather than perpendicular to it. I found that when improvising with other musicians, being able to play the rhythm is a great way to fill the musical space when you're not playing the melody. Chris Haigh's video is a great introduction to learning different chopping patterns that can be used in different musical genres and contexts.</p>",

        "<h5><a href='https://youtu.be/xfXjOX-L2LI?si=9Y532BP2qY3dF-1z' target='_blank' rel='noopener'>The Art of the Groove</a></h5>",
        "<p>The Turtle Island String Quartet was a large spark in my curiosity for improvisation, mixing classical music with elements of jazz and folk music. In their lecture series, &quot;The Art of the Groove&quot; from 2000, they showcase how traditional string quartet musicians can take on different roles. The players are constantly switching between 4 different main duties:</p>",
        "<ol><li>Providing a beat</li><li>Providing harmony</li><li>Playing the melody or improvising over it</li><li>Playing fills or a countermelody</li></ol>",

        "<h4>Practicing Improvisation</h4>",
        "<p>I believe that a good starting point to improvisation is to limit oneself to a certain ruleset, in the form of an exercise or a kind of musical game. Below you can find a list of some of the exercises I came up with, incorporating the elements of copying, imitation, and composing to different degrees. One of my goals when creating these was to approach improvisation in a multifaceted and open-minded way, without being tied to a certain genre, culture or tradition. I consider these exercises to be of more of an inspirational rather than formal nature, so feel free to change and improvise with them so to speak!</p>",

        "<h5>Solo Exercises</h5>",
        "<details><summary>Exercise 1: Find the Note</summary><p>&#9834; <em>Sing a random note or multiple notes, then try to find them on the violin as fast as you can.</em></p><p><strong>Variations</strong> &mdash; Increase the number of notes you sing before playing them. You can also choose to restrict yourself to a certain position on the violin. Some apps play random notes with adjustable tempos.</p><p><strong>Reflections</strong> &mdash; This is a fairly simple exercise, yet it trains the fundamental ability to play what you hear, something not commonly practiced in classical music education. When doing this exercise, I find myself listening for recognizable intervals or relations to tonal centers, but mostly I try to go by and let the fingers guide me.</p></details>",
        "<details><summary>Exercise 2: Imitating Birds</summary><p>&#9834; <em>Freely improvise with sounds that imitate birds.</em></p><p><strong>Variations</strong> &mdash; Imitate other animals, or sounds from other objects (a train) or landscapes (a forest).</p><p><strong>Reflections</strong> &mdash; Connecting music to mental images can be a useful tool to come up with improvisational ideas. You also have to be inventive and creative when you reproduce non-instrumental sounds on your instrument, perhaps using unconventional techniques or even creating new ones. It is also a freedom to play something on the violin without having to think about the musical context, and instead shifting the focus towards sounds.</p></details>",
        "<details><summary>Exercise 3: Scat Singing</summary><p>&#9834; <em>With a metronome set to &#9833;=60, sing a phrase with a swing feel, then try to repeat it on the violin.</em></p><p><strong>Variations</strong> &mdash; Experiment with the length of the phrases. You can also try to perform call and response, alternating between singing and playing every phrase. Finally, you can also try to sing and play at the same time.</p><p><strong>Reflections</strong> &mdash; This exercise was inspired by a video by jazz violinist <a href='https://youtu.be/8bzNac4RnHs?si=2RQDVvJnESRMd1a5' target='_blank' rel='noopener'>Eva Slongo</a>. When we sing, we get a natural feel for phrasing and rhythm that is desirable to mimic on our instrument. When combining the two means of expression, we are thus reinforcing the connection between them. This exercise is also a good opportunity to practice how bowing affects phrasing.</p></details>",
        "<details><summary>Exercise 4: Improvising within a Scale</summary><p>&#9834; <em>Choose a scale. Play a continuous stream of notes of the same length, but avoid repetition of the same intervals.</em></p><p><strong>Variations</strong> &mdash; Try out different subdivisions in your chosen tempo, such as quarter, eighth, and sixteenth notes, as well as triplets.</p><p><strong>Reflections</strong> &mdash; As classical musicians, we are often used to practicing scales ascending and or descending stepwise. While this is certainly useful for playing classical repertoire, we can most often play more melodically when mixing intervals. Getting other scale patterns in your fingers is thus a helpful tool to play a solo in other genres.</p></details>",
        "<details><summary>Exercise 5: Double-Stop Melody</summary><p>&#9834; <em>Choose a scale and a double-stop interval. Improvise a melody with these two elements, always playing two notes simultaneously.</em></p><p><strong>Variations</strong> &mdash; Try out thirds, sixths, octaves, fourths, and fifths, or more tricky intervals like tenths. You can also improvise a melody with a combination of several double-stop intervals.</p><p><strong>Reflections</strong> &mdash; Double-stops are another element of classical violin playing, that is expected to be practiced with ascending and descending, stepwise motion. However, I often identify a lack of progress and motivation when doing this type of practice. When instead improvising a melody, I find my left hand being much more relaxed and my ears more open.</p></details>",
        "<details><summary>Exercise 6: Feeling the Pentatonic Scale</summary><p>&#9834; <em>Find a backing track in any minor key. Play a solo in the pentatonic scale of the tonic.</em></p><p><strong>Variations</strong> &mdash; Add notes to the scale, such as the flatted 5th, the 9th, major 7th (E-flat, B natural, and G-sharp in the key of A-minor).</p><p><strong>Reflections</strong> &mdash; This exercise was inspired by videos with the musician <a href='https://www.youtube.com/watch?v=dzZdjBnwdF4' target='_blank' rel='noopener'>Rotem Sivan</a>. The pentatonic scale is a very useful tool to approach improvisation since it works well over many diatonic chords in the same key in genres such as jazz, pop, and rock. When doing this exercise, I try to focus on creating melodic lines, and on tension and release - especially when adding notes to the scale for variation.</p></details>",
        "<details><summary>Exercise 7: One String with Drone</summary><p>&#9834; <em>Improvise freely on either the A, D, or E string, while simultaneously playing a drone/bourdon using the open string below.</em></p><p><strong>Variations</strong> &mdash; Try playing either very fast or very slow.</p><p><strong>Reflections</strong> &mdash; I like this exercise for multiple reasons. Firstly, it forces you to practice on the whole string, which is often avoided, especially on the A and D strings. Secondly, by adding a drone you become more aware of what notes you are playing when improvising, by feeling their relation to the drone's root note. Finally, I found this exercise a good opportunity to practice being relaxed when performing shifts, only using my head on the chin rest when shifting downwards.</p></details>",
        "<details><summary>Exercise 8: Mini Raga</summary><p>&#9834; <em>Pick a scale and play a (tanpura) drone with its root note in the background. Improvise with notes from the scale in the style of a raga.</em></p><p><strong>Variations</strong> &mdash; Begin with a free tempo (alap). Optionally build on with more rhythmical sections (a jor and a jhala). Finally, you can add a rhythmic cycle (tala) to the jhala with a chosen number of beats.</p><p><strong>Reflections</strong> &mdash; This exercise provides a fun way to explore any tonality. Using a drone in the background makes you aware of the intervals between the melody and the root note, but also makes intonation easier. Having multiple &quot;sections&quot; in mind also forces you to plan ahead and think about the overall structure of your improvisation.</p></details>",
        "<details><summary>Exercise 9: Two Note Blues</summary><p>&#9834; <em>Play along to a twelve-bar blues backing track in any key. You are only allowed to play 2 notes of your choice.</em></p><p><strong>Variations</strong> &mdash; Allow the notes to be played in any octave, or increment the number of chosen notes. Try to play in keys that you are not too comfortable in.</p><p><strong>Reflections</strong> &mdash; This exercise was recounted in an interview with Fiona Monbet, who in turn learned it from her teacher, Didier Lockwood. It is a great example of how restrictions can open new doors in your playing. In this case, you can for example focus on rhythm and how you use the bow to generate a groovy sound in a blues, a musical form that is found in many different contexts.</p></details>",
        "<details><summary>Exercise 10: Improvising over a Tune</summary><p>&#9834; <em>Pick a tune with chords and a melody you know by heart. With a metronome giving the beat, improvise within the structure of the tune.</em></p><p><strong>Variations</strong> &mdash; Try out tunes from different genres, such as folk melodies, pop songs, or jazz standards.</p><p><strong>Reflections</strong> &mdash; Being able to improvise around a melody is a fundamental skill in many genres, yet it can be tricky to know how to approach the concept. I find the techniques by Darol Anger to be a good starting point and apply them to a tune you like. This exercise also makes you more aware of the harmonic context of the melody line, something often omitted when playing a melodic instrument such as the violin.</p></details>",

        "<h5>Exercises for Two (or More) Musicians</h5>",
        "<details><summary>Exercise 11: Pass the Note</summary><p>&#9834; <em>Stand with your back against your musician friend and vice versa. One plays a note on their instrument and the other tries to find it as fast as possible. Then you pass a new note back to your friend.</em></p><p><strong>Variations</strong> &mdash; Increment the number of notes passed each turn, or include double-stops.</p><p><strong>Reflections</strong> &mdash; This is an ear-training exercise that is very similar to Exercise 1, but being two musicians has the benefit of both being fun and allowing you to be more versatile with the rules.</p></details>",
        "<details><summary>Exercise 12: Counterpoint with Half and Eighth Notes</summary><p>&#9834; <em>One musician begins by playing two half notes. When finished, eighth notes are played instead, while the other musician joins by playing half notes, followed by eighth notes, and so on.</em></p><p><strong>Variations</strong> &mdash; Either decide on a tonality beforehand or rely solely on your ears. If you are more than two musicians, you can add quarter notes and whole notes.</p><p><strong>Reflections</strong> &mdash; This exercise was inspired by a video by the musicians Adam Neely and Ben Levin. I find that there are two main ways of approaching this exercise. The first is free counterpoint, which allows you to be progressive harmonically but leads to more chromaticism and dissonance. The second option is to be more imitative of the melodic material, leading to something sounding more like a canon.</p></details>",
        "<details><summary>Exercise 13: Improvising Grooves</summary><p>&#9834; <em>One musician starts by making up and repeating a short groove. The other musician improvises freely on the groove.</em></p><p><strong>Variations</strong> &mdash; If you are more than two musicians, either do collective improvisation or add fills, beats, or harmony to the groove.</p><p><strong>Reflections</strong> &mdash; This exercise was inspired by performances by the Turtle Island Quartet. They often rotate the roles of either having the beat, playing harmony, doing &quot;fills&quot; or soloing between the members. When giving the beat on the violin, I find it useful to use extended techniques such as chopping or tapping the instrument.</p></details>",
        "<details><summary>Exercise 14: Melody and Accompaniment</summary><p>&#9834; <em>Pick a tune with chords and a melody you are familiar with. One musician improvises the melody with ornaments and the other one improvises accompaniment over the chords. Shift the roles and repeat.</em></p><p><strong>Variations</strong> &mdash; Try out different ways of accompanying the melody, such as playing broken eighth notes, harmony, and adding a beat or sixteenth notes with chord shapes in your left hand.</p><p><strong>Reflections</strong> &mdash; This is similar to Exercise 10, but by being two (or more) musicians, the accompaniment always hears its relation to the melody, and it also becomes an exercise of playing together. Being able to play accompaniment from chord symbols on the violin is a useful skill in many types of genres when the usual accompanying instrument is absent or busy playing a solo.</p></details>",
        "<details><summary>Exercise 15: Free Improvisation</summary><p>&#9834; <em>Go completely free, anything is allowed!</em></p><p><strong>Variations</strong> &mdash; If you want some kind of guidelines or structure, play with elements such as dynamics and textures. Or make up your own rules!</p><p><strong>Reflections</strong> &mdash; As a classical musician, I find free improvisation to be a very liberating and fun activity. Admittedly, I was slightly skeptical about the concept and its progressive value. However, after trying it out a few times, I realized that it is an excellent way to keep your ears open to what is going on around you and respond by imitating, copying, or composing something. It also allows you to be creative with different timbres, means of sound production, and dynamics depending on the auditory context.</p></details>",

        "<h4>Personal Reflections</h4>",
        "<p>It is generally accepted that there is no universal metric for measuring the quality of art, or its beauty. This is certainly the case when it comes to musical improvisation, where there is no written music to serve as a reference, and where each performance is meant to sound different from another depending on its performers&rsquo; instincts. Thus evaluating one's progress when learning to improvise becomes a highly subjective as well as spiritual matter. Nevertheless, I believe there are certainly elements of improvisation that I have improved in after spending time practising it.</p>",
        "<p>One such element is the unblocking of inner obstacles, and daring to improvise in different contexts. As a classically trained violinist, there is a certain ideal of both reproduction and control, as in being able to accurately repeat a phrase and to play it expectedly, without &quot;mistakes&quot;. Whilst these ideals are not unimportant in improvisation, I found that embracing the feeling of inconstancy and insecurity unlocked new doors to being free while playing, without judging oneself too much.</p>",
        "<p>Moreover, I find that I have certainly become better at improvising, but mainly within certain forms or idioms. In folk music, one can become better at inventing variations on a melody. In jazz, one can learn how to play phrases within certain chords. In Indian music, one can improve the ability to build intensity towards a musical climax. There are certainly endless ways of approaching and expressing these skills, and what is good or bad is often a matter of personal taste. Nevertheless, I find that the more one is familiar with and aware of the canvas within which one is painting, the freer one can be when improvising. Or to use an analogy: the better you know the language of a musical region, the better you can communicate with musicians and listeners who speak the same language. Luckily, some vocabulary (e.g. the pentatonic scale) is similar across multiple genres, meaning that the ability to improvise in one context often is transferable to other contexts.</p>",
        "<p>Finally, I have through my exploration of the improvisational landscape also gained a better understanding of my identity as a musician. In the classical world, there is often a linear attitude towards developing as a musician. Progress is usually measured in metrics such as technicality, accuracy in rhythm and intonation, and how well the composer&rsquo;s intentions are realized. These elements are certainly not unimportant in improvisation, however the focus instead tends to be on finding and expressing one&rsquo;s own voice. With this change of perspective, I found my classical background to be of help rather than a hindrance, as it has provided me with additional technical tools and versatility to express myself when improvising. Inversely, improvising has helped me become less dogmatic in my approach to performing classical music. At the end of the day, the important things to me when playing music, are being in the moment, the emotions one is feeling, and the message one is conveying. I strongly feel that the time I spent approaching improvisation in recent months has deepened my connection to these musical elements, and has opened my eyes and ears towards a new path to music making.</p>"
      ]
    },

      title: "The Minor Arpeggio Trick",
      excerpt: "When I was studying at university, I was introduced to a concept by one of the double bass teachers, known as the \"minor arpeggio trick\" (or \"minor arpeggio secret\" by the bassist Chris West)…",
      full: [
        "<h4>Applying the Trick</h4>",
        "<p>When I was studying at university, I was introduced to a concept by one of the double bass teachers, known as the &quot;minor arpeggio trick&quot; (or &quot;minor arpeggio secret&quot; by the bassist <a href='https://www.youtube.com/watch?v=umdwB1m70es' target='_blank' rel='noopener'>Chris West</a>). It can be summarized as following (from <a href='https://en.wikipedia.org/wiki/Undertone_series' target='_blank' rel='noopener'>Wikipedia</a>):</p>",
        "<blockquote>If we can maintain the same tension while plucking a string twice, 3 times, 4 times that length, etc. the undertone series will unfold downwards, containing the minor triad. Similarly, on a wind instrument, if the holes are equally spaced, each successive hole covered will produce the next note in the undertone series.</blockquote>",
        "<p>For string players, this means that the distances corresponding to the intervals of a perfect (justly intonated) minor arpeggio will be exactly equally spaced on the fingerboard, as illustrated in the figure below:</p>",

        "<p class='caption'>The minor arpeggio unfolding by equal distances on a violin.</p>",
        "<p>To illustrate the phenomenon in a context, assume you are playing a E with your first finger followed by a G with your third finger on the same string (a just minor third). If you shift up to the G with your first finger, your third finger will land on a B (a just major third) if you kept the distance between your first and third finger unchanged. Similarly, if you shift your first finger from the G to the B, your third finger will land on an E (a perfect fourth) an octave higher than your starting note. This is followed by a perfect fifth and an octave.</p>",
        "<p>This &quot;trick&quot; will work regardless of your starting note or position, and becomes especially useful for double bassists since they often have to perform shifts with a constant hand frame. It could also be used to determine whether you need to increase or change the distance between your fingers when shifting up or down a string.</p>",

        "<h4>Why it works</h4>",
        "<p>When a string's length is multiplied or divided by a whole number, the ratios between the old and new lengths will also be a whole number, giving rise to <a href='https://en.wikipedia.org/wiki/Just_intonation' target='_blank' rel='noopener'>just intervals</a>, or <em>pure</em> intervals. For example, if we imagine a string producing the fundamental tone F that is 6 units long and divide it into 6 equally long parts, the following intervals would arise:</p>",
        "<table><thead><tr><th>Length ratio</th><th>Interval</th><th>Pitch</th></tr></thead><tbody><tr><td>1:6</td><td>6:1</td><td>C6</td></tr><tr><td>2:6</td><td>3:1</td><td>C5</td></tr><tr><td>3:6</td><td>2:1</td><td>F4</td></tr><tr><td>4:6</td><td>3:2</td><td>C4</td></tr><tr><td>5:6</td><td>6:5</td><td>A&#9837;3</td></tr><tr><td>6:6</td><td>1:1</td><td>F3</td></tr></tbody></table>",
        "<p class='caption'>The minor arpeggio from F3 derived from the undertone series on C6.</p>",
        "<p>In other words, the tones produced by the shortened strings with equal lengths form a pure F-minor arpeggio, explaining the &quot;trick&quot; above.</p>",
        "<p>A more systematic way of determining what pitches lengthening or shortening a string equidistantly produces, is to consider the <a href='https://en.wikipedia.org/wiki/Undertone_series' target='_blank' rel='noopener'>undertone series</a>. While the overtone series consists of tones with wavelengths that are whole number divisions of a fundamental wavelength, the undertone series consists of the opposite, i.e. wavelengths that are whole number multiples of a wavelength. Consequently, when we imagine a string shortened by equal distances such as in the table above, the fundamental of each new string will be found in the undertone series.</p>",

        "<p class='caption'>The undertone series on C.</p>",
        "<p>Thus, we could theoretically apply &quot;the minor arpeggio trick&quot; for any consecutive intervals found in the undertone series. However, from the 7th undertone and onwards, the pitches in the series start to diverge substantially from the pitches used in equal temperament, making them more difficult to use in a practical context.</p>",

    },

  function openPost(p){
    const modal = document.getElementById('post-modal');
    document.getElementById('post-modal-title').textContent = p.title;
    document.getElementById('post-modal-img').innerHTML = p.img
      ? `<div class="post-img"><img src="${p.img}" alt="${p.title}"></div>` : '';
    document.getElementById('post-modal-body').innerHTML = p.full.join('');
    modal.classList.add('show');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }
  function closePost(){
    const modal = document.getElementById('post-modal');
    modal.classList.remove('show');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }
  document.getElementById('post-modal-close').addEventListener('click', closePost);
  document.getElementById('post-modal').addEventListener('click', (e) => {
    if (e.target.id === 'post-modal') closePost();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePost();
  });

  function renderPosts(){
    const lead = posts.find(p => p.featured);
    const rest = lead ? posts.filter(p => p !== lead) : posts;

    document.getElementById('journal-lead').innerHTML = lead ? `
      <div class="journal-lead" tabindex="0" role="button" aria-label="${t('journal.readAria')}${lead.title}">
        <h3>${lead.title}</h3>
        <p>${lead.excerpt}</p>
        <p class="read-more">${t('journal.readMore')}</p>
      </div>
    ` : '';

    document.getElementById('post-grid').innerHTML = rest.map(p => `
      <article class="post-card" tabindex="0" role="button" aria-label="${t('journal.readAria')}${p.title}">
        <h3>${p.title}</h3>
        <p>${p.excerpt}</p>
        <p class="read-more">${t('journal.readMore')}</p>
      </article>
    `).join('');

    document.querySelectorAll('.journal-lead, .post-card').forEach((el, i) => {
      const post = lead ? (i === 0 ? lead : rest[i - 1]) : rest[i];
      el.addEventListener('click', () => openPost(post));
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPost(post); } });
    });
  }
  renderPosts();

  applyLanguage(currentLang);
</script>
